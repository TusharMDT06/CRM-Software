version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: flowdesk_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: flowdesk
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - flowdesk_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowdesk_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/flowdesk
      JWT_SECRET: flowdesk_production_jwt_secret_key_minimum_32_characters
      CLIENT_URL: http://localhost:80
      EMAIL_FROM: Flowdesk <onboarding@resend.dev>
      AUDIT_RETENTION_DAYS: 365
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    networks:
      - flowdesk_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flowdesk_client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - flowdesk_net

volumes:
  mongo_data:

networks:
  flowdesk_net:
    driver: bridge
